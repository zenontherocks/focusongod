<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Discussion — Focus On God</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/discussion.css" />
</head>
<body data-page="discussion">
  <div id="site-navbar"></div>

  <main class="container discussion-page">
    <h1>Discussion</h1>
    <p>Join the conversation below. Pick a topic, share your name, and post — no account needed.</p>

    <div id="discussion-topics" class="discussion-topics" aria-label="Topics">
      <p class="discussion-loading">Loading topics…</p>
    </div>

    <p id="discussion-empty" class="discussion-empty" hidden>
      No discussion topics yet — check back soon!
    </p>

    <section id="discussion-feed-section" hidden>
      <h2 id="discussion-topic-title"></h2>
      <p id="discussion-topic-description" class="discussion-topic__description"></p>

      <div id="discussion-messages" class="discussion-messages" aria-live="polite"></div>

      <form id="discussion-post-form" class="discussion-post-form">
        <div class="discussion-post-form__row">
          <label for="discussion-name">Your Name *</label>
          <input type="text" id="discussion-name" maxlength="60" required />
        </div>
        <div class="discussion-post-form__row">
          <label for="discussion-message">Message *</label>
          <textarea id="discussion-message" rows="3" maxlength="1000" required></textarea>
        </div>
        <div class="discussion-honeypot" aria-hidden="true">
          <label for="discussion-website">Website</label>
          <input type="text" id="discussion-website" tabindex="-1" autocomplete="off" />
        </div>
        <button type="submit" class="btn btn--primary">Post</button>
        <p class="discussion-post-form__status" id="discussion-post-status" role="status"></p>
      </form>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/site-shell.js"></script>
  <script src="js/dom-utils.js"></script>
  <script src="js/discussion.js"></script>
</body>
</html>
