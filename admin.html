<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Jewelry Admin — Focus On God</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body data-page="admin">
  <div id="site-navbar"></div>

  <main class="container admin-page">
    <h1>Jewelry/Other Listings Admin</h1>

    <section id="admin-lock" class="admin-card">
      <h2>Enter admin password</h2>
      <form id="admin-login-form">
        <input
          type="password"
          id="admin-password"
          placeholder="Password"
          required
          autocomplete="current-password"
        />
        <button type="submit" class="btn btn--primary">Unlock</button>
      </form>
      <p class="admin-status" id="admin-login-status" role="status"></p>
    </section>

    <section id="admin-content" hidden>
      <div class="admin-card">
        <h2>Add a new listing</h2>
        <form id="listing-form">
          <div class="admin-form__row">
            <label for="listing-image">Photos * (up to 8)</label>
            <input
              type="file"
              id="listing-image"
              accept="image/png, image/jpeg, image/webp"
              multiple
              required
            />
          </div>
          <div class="admin-form__row">
            <label for="listing-title">Title *</label>
            <input type="text" id="listing-title" required maxlength="200" />
          </div>
          <div class="admin-form__row">
            <label for="listing-description">Description (optional)</label>
            <textarea id="listing-description" rows="3" maxlength="2000"></textarea>
          </div>
          <div class="admin-form__row">
            <label for="listing-price">Price (USD) *</label>
            <input type="number" id="listing-price" min="0" step="0.01" required />
          </div>
          <button type="submit" class="btn btn--primary">Add Listing</button>
          <p class="admin-status" id="listing-form-status" role="status"></p>
        </form>
      </div>

      <div class="admin-card">
        <h2>Current listings</h2>
        <p class="admin-status" id="listings-status" role="status"></p>
        <div id="admin-listings"></div>
      </div>

      <div class="admin-card">
        <h2>Add a discussion topic</h2>
        <form id="topic-form">
          <div class="admin-form__row">
            <label for="topic-title">Title *</label>
            <input type="text" id="topic-title" required maxlength="100" />
          </div>
          <div class="admin-form__row">
            <label for="topic-description">Description (optional)</label>
            <textarea id="topic-description" rows="2" maxlength="300"></textarea>
          </div>
          <button type="submit" class="btn btn--primary">Add Topic</button>
          <p class="admin-status" id="topic-form-status" role="status"></p>
        </form>
      </div>

      <div class="admin-card">
        <h2>Current discussion topics</h2>
        <p class="admin-status" id="topics-status" role="status"></p>
        <div id="admin-topics"></div>
      </div>

      <div class="admin-card">
        <h2>Moderate discussion messages</h2>
        <div class="admin-form__row">
          <label for="moderation-topic-select">Topic</label>
          <select id="moderation-topic-select">
            <option value="">Select a topic…</option>
          </select>
        </div>
        <p class="admin-status" id="messages-status" role="status"></p>
        <div id="admin-messages"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/site-shell.js"></script>
  <script src="js/dom-utils.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
